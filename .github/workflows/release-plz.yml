name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Split deliberately into two jobs, as release-plz recommends: the PR job
  # runs on every push to main and keeps a "chore: release" PR up to date,
  # while the release job only does anything once that PR is merged and a
  # version actually needs tagging.
  release-pr:
    name: open or update the release PR
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # NOT the default GITHUB_TOKEN. See the `release` job below for why
          # this is load-bearing rather than a preference.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: tag and publish
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # This token MUST be a PAT, not the default GITHUB_TOKEN.
          #
          # GitHub deliberately refuses to trigger workflows from events
          # created with the default token, to stop runs recursing. The tag
          # this step pushes is exactly what `release.yml` (cargo-dist) waits
          # for — so with the default token the tag lands, crates.io publishes,
          # and the binary build never fires. Nothing errors. The result is a
          # half-release: a real tag and a real crate version, no binary, and a
          # tap formula still pointing at the previous version. It only
          # surfaces when someone runs `brew install`.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
