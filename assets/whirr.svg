<svg xmlns="http://www.w3.org/2000/svg" viewBox="-108 -108 216 216"
     width="216" height="216" role="img" aria-label="whirr">
  <title>whirr</title>
  <!-- Geometry is the app's own: 10 rays at 36 degrees, offset 18 so there are
       vertical rays and no horizontal one. Hub empty inside 0.26. The inner
       ring (0.26-0.58) and outer ring (0.68-1.0) turn opposite ways, and the
       band between them is never drawn. See src/ui/burst.rs. -->
  <style>
    .ring { transform-origin: 0 0; }
    .inner { animation: whirr-spin 9s linear infinite; }
    .outer { animation: whirr-spin 9s linear infinite reverse; }
    @keyframes whirr-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .inner, .outer { animation: none; }
    }
  </style>
