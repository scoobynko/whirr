<svg xmlns="http://www.w3.org/2000/svg" viewBox="-108 -108 216 216"
     width="216" height="216" role="img" aria-label="whirr">
  <title>whirr</title>
  <!-- Geometry from src/ui/burst.rs: 10 rays at 36 degrees offset by 18, hub
       empty inside 0.26, inner ring 0.26-0.58 and outer 0.68-1.0 turning
       opposite ways with a dead band between them.

       The outer ring is parked half a ray-step round. The two rings almost
       never line up in the app, and drawing both at zero collapses the mark
       into ten continuous spokes instead of twenty offset segments. -->
  <style>
    .ring { transform-origin: 0 0; }
    .inner { animation: whirr-spin 9s linear infinite; }
    .outer { animation: whirr-spin 9s linear infinite reverse; }
    @keyframes whirr-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .inner, .outer { animation: none; } }
  </style>
  <g fill="#2de1c2">
